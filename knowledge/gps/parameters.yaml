# Multi-Domain Telemetry Parameter Registry
# Version: 1.0
# Purpose: Centralized definition for 1000+ parameters across GPS, CAN, MQTT, and other domains
# Scalability: Add parameters for any domain without creating new files

# ==============================================================================
# GPS DOMAIN PARAMETERS (10+ params shown, easily extendable)
# ==============================================================================
gps:
  parameters:
    fix_quality:
      name: "Fix Quality"
      symbol: "FIX QUA"
      type: "integer"
      valid_range: [0, 1]
      units: "level"
      description: "0=No Fix, 1=Valid Fix"
      critical: true
      rule_id: "GPS_001"

    satellite_count:
      name: "Satellite Count"
      symbol: "SAT"
      type: "integer"
      valid_range: [0, 32]
      units: "count"
      description: "Number of visible satellites"
      thresholds:
        weak: [0, 3]
        acceptable: [4, 7]
        strong: [8, 32]
      critical: true
      rule_id: "GPS_002"

    latitude:
      name: "Latitude"
      symbol: "LAT"
      type: "float"
      valid_range: [-90.0, 90.0]
      units: "degrees"
      description: "Geographic latitude"
      invalid_value: 0.0
      critical: true
      rule_id: "GPS_003"

    longitude:
      name: "Longitude"
      symbol: "LONG"
      type: "float"
      valid_range: [-180.0, 180.0]
      units: "degrees"
      description: "Geographic longitude"
      invalid_value: 0.0
      critical: true
      rule_id: "GPS_003"

    speed_kmph:
      name: "Speed"
      symbol: "SPEED_KMPH"
      type: "float"
      valid_range: [0.0, 180.0]
      units: "km/h"
      description: "Vehicle speed"
      critical: false
      rule_id: "GPS_004"

    altitude:
      name: "Altitude"
      symbol: "ALT"
      type: "float"
      valid_range: [0, 8848]
      units: "meters"
      description: "Altitude above sea level"
      critical: false
      rule_id: "GPS_006"

    hdop:
      name: "Horizontal Dilution of Precision"
      symbol: "HDOP"
      type: "float"
      valid_range: [0.5, 50.0]
      units: "ratio"
      description: "Position accuracy (< 2.0 excellent, < 5.0 good)"
      thresholds:
        excellent: [0.5, 2.0]
        good: [2.0, 5.0]
        poor: [5.0, 50.0]
      critical: false
      rule_id: "GPS_005"

    vdop:
      name: "Vertical Dilution of Precision"
      symbol: "VDOP"
      type: "float"
      valid_range: [0.5, 50.0]
      units: "ratio"
      description: "Altitude accuracy"
      critical: false

    pdop:
      name: "Position Dilution of Precision"
      symbol: "PDOP"
      type: "float"
      valid_range: [0.5, 50.0]
      units: "ratio"
      description: "Overall position accuracy"
      critical: false

    heading:
      name: "Heading"
      symbol: "HEADING DEG"
      type: "float"
      valid_range: [0.0, 360.0]
      units: "degrees"
      description: "Direction of travel"
      critical: false

    utc_time:
      name: "UTC Time"
      symbol: "UTC"
      type: "string"
      pattern: "^\\d{2}:\\d{2}:\\d{2}$"
      units: "HH:MM:SS"
      description: "UTC timestamp from GPS"
      critical: true
      rule_id: "R_GPS_001"

    date:
      name: "Date"
      symbol: "DT"
      type: "string"
      pattern: "^\\d{6}$"
      units: "DDMMYY"
      description: "Date from GPS"
      critical: true
      rule_id: "R_GPS_001"

  # GPS-specific anomaly rules
  anomaly_rules:
    no_satellite_acquisition:
      id: "GPS_KN_001"
      condition: "SAT == 0 AND FIX_QUA == 0"
      persistence_required: "120 seconds"
      severity: "HIGH"
      why_it_happened: "GPS receiver lost RF satellite signals or experienced antenna disconnection during boot or run time."
      what_to_look_up: "Inspect GPS antenna co-axial cable, LNA power supply, and satellite cold-boot search timeouts in FW."
      suggested_fix: "Investigate satellite reception and antenna placement to restore GPS lock."
      root_causes:
        - "antenna disconnected"
        - "indoor/no-sky condition"
        - "GPS RF interference"

    satellite_visible_no_fix:
      id: "GPS_KN_002"
      condition: "SAT >= 4 AND FIX_QUA == 0"
      persistence_required: "30 seconds"
      severity: "HIGH"
      why_it_happened: "Satellites visible (SAT >= 4) but navigation engine failed to calculate 3D position fix."
      what_to_look_up: "Inspect GNSS ephemeris data validity, HDOP dilution, and multipath reflections in testing environment."
      suggested_fix: "Verify GPS fix acquisition logic and ensure enough visible satellites are present."
      root_causes:
        - "timing synchronization issue"
        - "GPS software stack bug"
        - "receiver initialization incomplete"

    invalid_coordinates:
      id: "GPS_KN_003"
      condition: "FIX_QUA == 1 AND (LAT == 0.0 OR LONG == 0.0)"
      severity: "MEDIUM"
      why_it_happened: "Invalid zero coordinates reported while fix quality bit was set to 1."
      what_to_look_up: "Inspect NMEA $GPGGA parser logic and C-struct coordinate payload serializer."
      suggested_fix: "Check GPS sensor configuration and ensure proper coordinate formatting."
      root_causes:
        - "UART parser error"
        - "data corruption"

    low_satellite_count:
      id: "GPS_KN_004"
      condition: "SAT < 4 AND SAT > 0"
      severity: "MEDIUM"
      why_it_happened: "Satellite count dropped below the 4-satellite threshold required for reliable 3D position fixes."
      what_to_look_up: "Inspect physical sky visibility (tunnels/underpasses) or RF interference from adjacent cellular TX lines."
      suggested_fix: "Check satellite visibility and antenna orientation to improve satellite count."
      root_causes:
        - "weak RF signal"
        - "antenna position suboptimal"
        - "multipath interference"


  # GPS baseline expectations
  baseline_expectations:
    cold_start:
      fix_time_range: [60, 120]
      units: "seconds"
      description: "Power-on from 0% state"

    hot_start:
      fix_time_range: [10, 30]
      units: "seconds"
      description: "Resume from valid state"

    stabilization_window:
      duration: [30, 120]
      units: "seconds"
      description: "Allow transient zero values during boot"

    normal_satellite_range:
      range: [5, 15]
      units: "count"
      description: "Expected satellites in normal operation"

