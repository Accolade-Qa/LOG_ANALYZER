parameters:
  csq:
    name: "Signal Quality Index"
    symbol: "CSQ"
    type: "integer"
    valid_range: [5, 31]
    description: "Cellular signal strength (0-31)"

  creg:
    name: "GSM Network Registration"
    symbol: "CREG"
    type: "integer"
    valid_range: [1, 1]
    description: "GSM circuit-switched network status (1=registered)"

  cgreg:
    name: "GPRS Data Registration"
    symbol: "CGREG"
    type: "integer"
    valid_range: [1, 1]
    description: "GPRS packet-switched network status (1=registered)"

anomaly_rules:
  poor_signal:
    id: "NET_KN_001"
    condition: "CSQ < 5"
    severity: "MEDIUM"
    why_it_happened: "Cellular signal quality dropped below minimum usable threshold (CSQ < 5)."
    what_to_look_up: "Inspect LTE main/diversity antenna connections, SIM socket contacts, and cell tower handoff logs."
    suggested_fix: "Improve radio signal strength or move the device to a better reception area."

  gsm_reg_failed:
    id: "NET_KN_002"
    condition: "CREG == 0"
    severity: "HIGH"
    why_it_happened: "GSM network registration failed (CREG=0). Modem could not attach to voice/SMS network."
    what_to_look_up: "Verify SIM PIN/PUK status, roaming settings, and modem AT command sequence (`AT+CREG?`)."
    suggested_fix: "Verify GSM registration credentials and network coverage."

  gprs_reg_failed:
    id: "NET_KN_003"
    condition: "CGREG == 0"
    severity: "HIGH"
    why_it_happened: "GPRS packet data service registration failed (CGREG=0)."
    what_to_look_up: "Verify APN configuration, PDP context activation status (`AT+CGACT`), and mobile data roaming."
    suggested_fix: "Inspect packet data connectivity and mobile network registration."

  operator_missing:
    id: "NET_KN_004"
    condition: "operator == ''"
    severity: "LOW"
    why_it_happened: "Network operator name string was not returned by SIM card or modem."
    what_to_look_up: "Inspect response of `AT+COPS?` command and verify SIM card network profile."
    suggested_fix: "Confirm operator information is available and correctly reported."

  no_socket_traffic:
    id: "NET_KN_005"
    condition: "tcp_skt == 0 and mqtt_count == 0"
    severity: "MEDIUM"
    why_it_happened: "No active TCP socket or telemetry data traffic detected on network interface."
    what_to_look_up: "Check socket creation error codes, PPP link status, and cellular data buffer overflow."
    suggested_fix: "Check network connectivity and active socket usage for telemetry traffic."
