<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCU Diagnostic Workbench — AIS-140 Live Telemetry & Copilot</title>
  
  <!-- Tailwind CSS CDN (Zero-build) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0B1120',
              panel: '#0F172A',
              card: '#1E293B',
              border: '#334155',
              cyan: '#06B6D4',
              blue: '#3B82F6',
              purple: '#A855F7',
            }
          }
        }
      }
    }
  </script>

  <!-- Dark Industrial Custom CSS -->
  <link rel="stylesheet" href="/css/theme.css">
</head>

<body class="bg-[#0B1120] text-slate-100 flex flex-col h-screen overflow-hidden select-none">

  <!-- TOP APP HEADER -->
  <header class="h-14 bg-slate-900/90 border-b border-slate-800 px-4 flex items-center justify-between flex-shrink-0 z-30 shadow-lg backdrop-blur">
    <!-- Brand & Title -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-black text-white text-base shadow-md shadow-cyan-500/20">
        ⚡
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white flex items-center gap-2">
          TCU DIAGNOSTIC WORKBENCH
          <span class="text-[10px] font-semibold px-1.5 py-0.2 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">v2.0 AIS-140</span>
        </h1>
        <p class="text-[11px] text-slate-400 font-mono">Autonomous Fleet Telemetry & Live Copilot Engine</p>
      </div>
    </div>

    <!-- Live Stream Ingestion Controls -->
    <div class="flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-lg border border-slate-800">
      <!-- Mode Selector -->
      <select id="stream-mode-select" class="bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
        <option value="file">Static Log File</option>
        <option value="tail">Live Tail (tail -f)</option>
        <option value="uart">Hardware UART (COM)</option>
      </select>

      <!-- Source / File / Port Selector -->
      <select id="stream-source-select" class="bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 max-w-[240px] truncate">
        <option value="">Loading logs...</option>
      </select>

      <!-- Control Buttons -->
      <button id="btn-stream-start" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold shadow transition-all flex items-center gap-1">
        <span>▶ Start Stream</span>
      </button>

      <button id="btn-stream-pause" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded text-xs font-semibold shadow transition-all hidden items-center gap-1">
        <span>⏸ Pause</span>
      </button>

      <button id="btn-stream-stop" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded text-xs font-semibold shadow transition-all hidden items-center gap-1">
        <span>⏹ Stop</span>
      </button>
    </div>

    <!-- Live Metrics & Status Indicators -->
    <div class="flex items-center gap-3">
      <!-- Stream State Badge -->
      <div class="flex items-center gap-1.5">
        <span id="badge-stream-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span id="badge-stream-state" class="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">IDLE</span>
      </div>

      <!-- Ingestion Speed -->
      <div class="bg-slate-950 px-2.5 py-1 rounded border border-slate-800 flex flex-col text-right">
        <span class="text-[9px] text-slate-500 font-bold uppercase">Throughput</span>
        <span id="metric-speed" class="text-xs font-mono font-bold text-cyan-400">0 lines/s</span>
      </div>

      <!-- Processed Lines -->
      <div class="bg-slate-950 px-2.5 py-1 rounded border border-slate-800 flex flex-col text-right">
        <span class="text-[9px] text-slate-500 font-bold uppercase">Processed</span>
        <span id="metric-lines" class="text-xs font-mono font-bold text-slate-300">0 lines</span>
      </div>

      <!-- Server WebSocket Online Badge -->
      <span id="badge-ws-status" class="text-[10px] font-semibold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
        CONNECTING...
      </span>
    </div>
  </header>


  <!-- MAIN 3-COLUMN WORKBENCH LAYOUT -->
  <main class="flex-1 grid grid-cols-12 gap-3 p-3 min-h-0 overflow-hidden">
    
    <!-- LEFT COLUMN: Telemetry HUD (3 cols) -->
    <section class="col-span-3 h-full min-h-0">
      <div id="left-telemetry-hud-container" class="h-full">
        <!-- Injected by TelemetryHUD component -->
      </div>
    </section>


    <!-- CENTER COLUMN: High-Performance Log Viewer (5 cols) -->
    <section class="col-span-5 h-full min-h-0">
      <div id="center-log-viewer-container" class="h-full">
        <!-- Injected by LogViewer component -->
      </div>
    </section>


    <!-- RIGHT COLUMN: AI Copilot, Anomaly Inspector & State FOTA Checklist (4 cols) -->
    <section class="col-span-4 h-full min-h-0 flex flex-col bg-slate-900/60 border border-slate-800 rounded-lg overflow-hidden shadow-2xl">
      <!-- Tab Header Buttons -->
      <div class="flex items-center bg-slate-900 border-b border-slate-800 text-xs font-semibold px-2 pt-1.5 gap-2">
        <button data-tab="copilot" class="right-tab-btn px-3 py-1.5 pb-2 text-cyan-300 border-b-2 border-cyan-400 transition-all flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
          <span>AI Copilot</span>
        </button>
        <button data-tab="anomalies" class="right-tab-btn px-3 py-1.5 pb-2 text-slate-400 hover:text-slate-200 transition-all flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-rose-400"></span>
          <span>Anomalies</span>
        </button>
        <button data-tab="fota" class="right-tab-btn px-3 py-1.5 pb-2 text-slate-400 hover:text-slate-200 transition-all flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-purple-400"></span>
          <span>State FOTA</span>
        </button>
      </div>

      <!-- Tab Contents Container -->
      <div class="flex-1 min-h-0 relative">
        <!-- Tab 1: Copilot -->
        <div id="tab-copilot" class="right-tab-pane absolute inset-0">
          <div id="copilot-tab-container" class="h-full"></div>
        </div>

        <!-- Tab 2: Anomalies -->
        <div id="tab-anomalies" class="right-tab-pane absolute inset-0 hidden">
          <div id="anomaly-tab-container" class="h-full"></div>
        </div>

        <!-- Tab 3: State FOTA Checklist -->
        <div id="tab-fota" class="right-tab-pane absolute inset-0 hidden">
          <div id="fota-tab-container" class="h-full"></div>
        </div>
      </div>
    </section>

  </main>


  <!-- MODAL: CIP1 Dynamic Parameter Audit -->
  <div id="modal-cip1-audit" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 bg-slate-950 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-purple-400"></span>
          <h2 class="text-sm font-bold text-purple-300">CIP1 Dynamic Parameter & Firmware Audit</h2>
        </div>
        <button id="btn-close-cip1-modal" class="text-slate-400 hover:text-white text-base">✕</button>
      </div>
      <div id="modal-cip1-content" class="p-4 overflow-y-auto font-sans text-xs text-slate-200 copilot-body space-y-3">
        <!-- Populated via API -->
      </div>
    </div>
  </div>


  <!-- ES6 Main Module -->
  <script type="module" src="/js/app.js"></script>

</body>
</html>
