# Automotive Firmware Over-The-Air (FOTA) & Configuration Telemetry Knowledge Base
# Standards: Automotive Telematics Remote Firmware & Parameter Update Protocol

fota:
  parameters:
    ota_command:
      name: "OTA Configuration Command"
      symbol: "OTA CMD"
      type: "string"
      description: "Remote command received via TCP socket or serial console"
      critical: true

    fota_state:
      name: "FOTA Task Operational State"
      symbol: "FOTA STATE"
      type: "string"
      description: "idle, active, downloading, flash_writing"
      critical: true

    queue_overflow:
      name: "FOTA Network Queue Overflow"
      symbol: "FOTA QUEUE FULL"
      type: "boolean"
      description: "True if FOTA network queue dropped a packet due to buffer exhaustion"
      critical: true
      rule_id: "FOTA_KN_001"

    state_configuration:
      name: "State Government AIS-140 Server Configuration"
      symbol: "STATE CONFIG"
      type: "string"
      description: "State-specific AIS-140 primary and secondary regulatory server IP and port configuration (e.g. MH, KL, DL, KA)"
      critical: true

  anomaly_rules:
    fota_queue_overflow:
      id: "FOTA_KN_001"
      condition: "QUEUE_FULL == True"
      severity: "HIGH"
      why_it_happened: "FOTA transmission network queue became full; outgoing telemetry or acknowledgment packet was dropped."
      what_to_look_up: "Inspect TCP socket upload bandwidth, cellular latency, and FreeRTOS queue buffer sizing in firmware."
      suggested_fix: "Increase qNET_TCP_AEPL queue depth or optimize TCP transmission acknowledgment timing."
      root_causes:
        - "cellular transmission delay"
        - "unresponsive backend OTA server"
        - "small RTOS queue buffer allocation"

    fota_tcp_dropout:
      id: "FOTA_KN_002"
      condition: "TCP_DROPPED == True"
      severity: "HIGH"
      why_it_happened: "TCP connection to OTA server dropped during active download or parameter configuration."
      what_to_look_up: "Check cellular signal quality (CSQ) and server keepalive timeouts."
      suggested_fix: "Verify cellular link stability and implement exponential backoff resume download logic."
      root_causes:
        - "cellular base station handover"
        - "server reset connection"

    fota_state_handshake_timeout:
      id: "FOTA_KN_003"
      condition: "STATE_CONFIG_TIMEOUT == True"
      severity: "HIGH"
      why_it_happened: "Post-flash AIS-140 state configuration command (*SET#SWEMP#..., *SET#CHTP#..., *SET#CIP1#...) timed out waiting for device acknowledgment."
      what_to_look_up: "Inspect modem AT command buffer, OTA command watchdog (60s), and device stateEnableSetStatus in backend."
      suggested_fix: "Verify modem TCP socket 2 responsiveness and re-trigger state configuration command."
      root_causes:
        - "TCU busy executing flash installation"
        - "cellular link drop during round-trip handshake"
        - "unsupported state command format"

    fota_state_migration_mismatch:
      id: "FOTA_KN_004"
      condition: "STATE_ENDPOINT_MISMATCH == True"
      severity: "CRITICAL"
      why_it_happened: "Device reconnected after FOTA reboot, but 55AA,1 login packet server IP/Port did not match newly configured Indian State endpoints."
      what_to_look_up: "Inspect EEPROM / flash non-volatile storage commit for *SET#CIP1# or *SET#CHTP# commands."
      suggested_fix: "Re-send state IP/port configuration commands and verify flash write persistence."
      root_causes:
        - "EEPROM write failure"
        - "device rebooted before configuration committed to non-volatile memory"
        - "state command syntax rejected by TCU firmware"
