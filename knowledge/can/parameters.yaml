parameters:
  engine_rpm:
    name: "Engine RPM"
    symbol: "CAN_RPM"
    type: "integer"
    valid_range: [0, 8000]
    units: "rpm"
    description: "Engine speed in revolutions per minute"
    critical: true

  vehicle_speed:
    name: "Vehicle Speed"
    symbol: "CAN_SPEED"
    type: "float"
    valid_range: [0.0, 250.0]
    units: "km/h"
    description: "Vehicle speed reported by CAN bus"
    critical: true

  engine_temperature:
    name: "Engine Temperature"
    symbol: "CAN_ENG_TEMP"
    type: "float"
    valid_range: [-40.0, 150.0]
    units: "Celsius"
    description: "Engine coolant or oil temperature"
    critical: true

  accelerator_position:
    name: "Accelerator Position"
    symbol: "CAN_ACCEL"
    type: "float"
    valid_range: [0.0, 100.0]
    units: "percent"
    description: "Throttle or accelerator pedal position"
    critical: false

anomaly_rules:
  uds_timeout:
    id: "CAN_KN_001"
    condition: "UDS Session Timeout"
    severity: "HIGH"
    why_it_happened: "UDS diagnostic session timed out waiting for ECU flow-control response."
    what_to_look_up: "Check CAN bus 120-Ohm termination resistors, CAN transceiver silent mode, and ECU diagnostic buffer overload."
    suggested_fix: "Investigate UDS session stability and ensure timeouts are handled properly."
    root_causes:
      - "CAN bus termination fault"
      - "ECU diagnostic response latency"

  dtc_reported:
    id: "CAN_KN_002"
    condition: "DTC hex code broadcast"
    severity: "CRITICAL"
    why_it_happened: "Diagnostic Trouble Code (DTC) broadcasted on CAN bus by vehicle ECU."
    what_to_look_up: "Cross-reference DTC hex code against vehicle fault code dictionary and inspect sensor line wiring."
    suggested_fix: "Review fault codes and diagnose the underlying CAN module issue."
    root_causes:
      - "ECU fault state"
      - "sensor line short/open circuit"
